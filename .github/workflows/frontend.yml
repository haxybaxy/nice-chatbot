# Frontend quality gate: `just ci` (prettier --check, eslint with 0 warnings, tsc, knip, jscpd,
# madge, fallow, the contract check, and vitest with MSW + the runtime contract validator).
#
# The contract check compares committed files only (backend/tests/guards/openapi.snapshot.json →
# frontend/src/test/contract/openapi.json → frontend/src/shared/api/generated/schema.d.ts), so
# this job needs Node, not uv or Postgres. That is why the backend snapshot is in `paths`: a
# backend PR that ran `just openapi-snapshot` but not `just contract-refresh` fails here.
#
# To make this binding, require the "frontend / just ci" check in the branch protection rules
# for `main` (a repository setting, not something this file can enforce).
name: frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/tests/guards/openapi.snapshot.json"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/tests/guards/openapi.snapshot.json"
      - ".github/workflows/frontend.yml"

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: just ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # Node major from frontend/.nvmrc (package.json `engines` is only the floor — a range there
      # would resolve to the newest major on the runner). `uses:` inputs are repo-relative, unlike
      # `run:` steps.
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: extractions/setup-just@v3

      - run: npm ci

      - run: just ci
