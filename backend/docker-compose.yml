name: acme

services:
  postgres:
    image: postgres:18-alpine
    container_name: acme_postgres
    ports:
      - "5432:5432"
    env_file:
      - docker.env
    volumes:
      # PG18 images root their data under /var/lib/postgresql (not /var/lib/postgresql/data).
      - postgres_data:/var/lib/postgresql
      - ./docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d acme"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
