[alembic]
script_location = %(here)s/app/db/migrations

# Dated, sortable migration filenames: 2026_09_12_1430-<rev>_<slug>.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Run from backend/ so `app` is importable.
prepend_sys_path = .
path_separator = os

# The database URL comes from app.core.config.settings inside env.py, never from this file.
# Logging is configured by env.py through app.core.logging (no [loggers] sections here).

[post_write_hooks]
# Lint-fix (drops the unused `sa` import on empty migrations) then format each new revision.
hooks = ruff_check, ruff_format
ruff_check.type = exec
ruff_check.executable = uv
ruff_check.options = run ruff check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = uv
ruff_format.options = run ruff format REVISION_SCRIPT_FILENAME
